name: Build Dictaphone Windows Executable

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Dictaphone.exe (Windows 64-bit)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Executable via PyInstaller
        run: |
          python build.py
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"

      - name: Build NSIS Installer
        run: |
          makensis.exe /INPUTCHARSET UTF8 installer.nsi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dictaphone-Windows-x64
          path: |
            dist/Dictaphone/
            dist/DictaphoneSetup.exe
          if-no-files-found: error

      - name: Create Zip Archive for Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          Compress-Archive -Path dist/Dictaphone -DestinationPath dist/Dictaphone-Windows-x64.zip

      - name: Release to GitHub (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Dictaphone-Windows-x64.zip
            dist/DictaphoneSetup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
